name: Linux Build

on:
  push:
    branches:
    - '**'
    tags:
    - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:

    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Build, test and package
      run: ./build_linux.sh --deps --test
    - name: Upload binary
      uses: actions/upload-artifact@v4
      with:
        name: ArmorPaint-linux-x64
        path: dist/*.tar.gz
        if-no-files-found: error
    - name: Attach binary to release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: dist/*.tar.gz
